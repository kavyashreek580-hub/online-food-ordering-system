<!DOCTYPE html>
<html>
<head>
    <title>Online Food Ordering System - UML Diagram</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h2 {
            color: #333;
        }

        svg {
            background: #fff;
            border: 1px solid #aaa;
            max-width: 100%;
            height: auto;
        }

        .class-box {
            fill: #eadce8;
            stroke: #333;
            stroke-width: 1.5;
        }

        .separator {
            stroke: #333;
            stroke-width: 1;
        }

        .class-name {
            font-weight: bold;
            font-size: 16px;
            text-anchor: middle;
        }

        .details {
            font-size: 13px;
        }

        .relationship {
            stroke: #333;
            stroke-width: 1.5;
            fill: none;
        }
    </style>
</head>

<body>

<h2>ONLINE FOOD ORDERING SYSTEM</h2>

<svg viewBox="0 0 1100 850" width="1100"
     xmlns="http://www.w3.org/2000/svg">

    <!-- Relationships -->

    <!-- Delivery to Order -->
    <line class="relationship" x1="150" y1="260"
          x2="150" y2="430"/>

    <!-- Order to Payment -->
    <line class="relationship" x1="230" y1="450"
          x2="390" y2="290"/>

    <!-- Review to Customer -->
    <line class="relationship" x1="710" y1="280"
          x2="550" y2="430"/>
    <polygon points="550,430 562,425 557,438"
             fill="#333"/>

    <!-- Order to Customer -->
    <line class="relationship" x1="230" y1="480"
          x2="390" y2="480"/>

    <!-- Order to Admin -->
    <line class="relationship" x1="230" y1="550"
          x2="720" y2="550"/>

    <!-- Customer to Cart -->
    <line class="relationship" x1="550" y1="550"
          x2="710" y2="700"/>

    <!-- Dish to Menu -->
    <line class="relationship" x1="230" y1="700"
          x2="390" y2="660"/>
    <polygon points="390,660 378,654 378,666"
             fill="white" stroke="#333"/>

    <!-- Dish to Cart -->
    <line class="relationship" x1="230" y1="730"
          x2="710" y2="730"/>
    <polygon points="710,730 698,724 698,736"
             fill="white" stroke="#333"/>


    <!-- DELIVERY CLASS -->
    <rect class="class-box" x="60" y="40"
          width="190" height="220"/>
    <line class="separator" x1="60" y1="80"
          x2="250" y2="80"/>
    <line class="separator" x1="60" y1="180"
          x2="250" y2="180"/>
    <text class="class-name" x="155" y="66">Delivery</text>
    <text class="details" x="70" y="105">
        <tspan x="70" dy="0">+ int deliveryId</tspan>
        <tspan x="70" dy="20">+ name: string</tspan>
        <tspan x="70" dy="20">+ date: string</tspan>
        <tspan x="70" dy="20">+ address: string</tspan>
    </text>
    <text class="details" x="70" y="205">
        <tspan x="70">+ update()</tspan>
    </text>


    <!-- PAYMENT CLASS -->
    <rect class="class-box" x="390" y="100"
          width="190" height="220"/>
    <line class="separator" x1="390" y1="140"
          x2="580" y2="140"/>
    <line class="separator" x1="390" y1="240"
          x2="580" y2="240"/>
    <text class="class-name" x="485" y="126">Payment</text>
    <text class="details" x="400" y="165">
        <tspan x="400">+ id: int</tspan>
        <tspan x="400" dy="20">+ cardnumber: string</tspan>
        <tspan x="400" dy="20">+ amount: string</tspan>
        <tspan x="400" dy="20">+ paymentstatus: string</tspan>
    </text>
    <text class="details" x="400" y="265">
        <tspan x="400">+ add()</tspan>
        <tspan x="400" dy="20">+ update()</tspan>
    </text>


    <!-- REVIEW CLASS -->
    <rect class="class-box" x="710" y="100"
          width="200" height="200"/>
    <line class="separator" x1="710" y1="140"
          x2="910" y2="140"/>
    <line class="separator" x1="710" y1="220"
          x2="910" y2="220"/>
    <text class="class-name" x="810" y="126">Review</text>
    <text class="details" x="720" y="165">
        <tspan x="720">+ reviewId: int</tspan>
        <tspan x="720" dy="20">+ rating: int</tspan>
        <tspan x="720" dy="20">+ comments: string</tspan>
    </text>
    <text class="details" x="720" y="245">
        <tspan x="720">+ editReview()</tspan>
        <tspan x="720" dy="20">+ deleteReview()</tspan>
    </text>


    <!-- ORDER CLASS -->
    <rect class="class-box" x="60" y="430"
          width="190" height="220"/>
    <line class="separator" x1="60" y1="470"
          x2="250" y2="470"/>
    <line class="separator" x1="60" y1="560"
          x2="250" y2="560"/>
    <text class="class-name" x="155" y="456">Order</text>
    <text class="details" x="70" y="495">
        <tspan x="70">+ id: int</tspan>
        <tspan x="70" dy="20">+ details: int</tspan>
        <tspan x="70" dy="20">+ double amount</tspan>
        <tspan x="70" dy="20">+ string orderDate</tspan>
    </text>
    <text class="details" x="70" y="585">
        <tspan x="70">+ placeOrder()</tspan>
        <tspan x="70" dy="20">+ cancelOrder()</tspan>
    </text>


    <!-- CUSTOMER CLASS -->
    <rect class="class-box" x="390" y="430"
          width="190" height="180"/>
    <line class="separator" x1="390" y1="470"
          x2="580" y2="470"/>
    <line class="separator" x1="390" y1="550"
          x2="580" y2="550"/>
    <text class="class-name" x="485" y="456">Customer</text>
    <text class="details" x="400" y="495">
        <tspan x="400">+ customerId: int</tspan>
        <tspan x="400" dy="18">+ name: string</tspan>
        <tspan x="400" dy="18">+ email: string</tspan>
        <tspan x="400" dy="18">+ password: string</tspan>
    </text>
    <text class="details" x="400" y="575">
        <tspan x="400">+ login()</tspan>
        <tspan x="400" dy="18">+ register()</tspan>
        <tspan x="400" dy="18">+ placeOrder()</tspan>
    </text>


    <!-- ADMIN CLASS -->
    <rect class="class-box" x="720" y="450"
          width="190" height="180"/>
    <line class="separator" x1="720" y1="490"
          x2="910" y2="490"/>
    <line class="separator" x1="720" y1="570"
          x2="910" y2="570"/>
    <text class="class-name" x="815" y="476">Admin</text>
    <text class="details" x="730" y="515">
        <tspan x="730">+ name: string</tspan>
        <tspan x="730" dy="18">+ contactnum: string</tspan>
        <tspan x="730" dy="18">+ username: string</tspan>
        <tspan x="730" dy="18">+ password: string</tspan>
    </text>
    <text class="details" x="730" y="595">
        <tspan x="730">+ create()</tspan>
        <tspan x="730" dy="18">+ update()</tspan>
    </text>


    <!-- DISH CLASS -->
    <rect class="class-box" x="60" y="700"
          width="190" height="160"/>
    <line class="separator" x1="60" y1="740"
          x2="250" y2="740"/>
    <line class="separator" x1="60" y1="800"
          x2="250" y2="800"/>
    <text class="class-name" x="155" y="726">Dish</text>
    <text class="details" x="70" y="765">
        <tspan x="70">+ id: int</tspan>
        <tspan x="70" dy="18">+ name: string</tspan>
        <tspan x="70" dy="18">+ price: string</tspan>
    </text>
    <text class="details" x="70" y="825">
        <tspan x="70">+ add()</tspan>
        <tspan x="70" dy="18">+ update()</tspan>
    </text>


    <!-- MENU CLASS -->
    <rect class="class-box" x="390" y="650"
          width="190" height="150"/>
    <line class="separator" x1="390" y1="690"
          x2="580" y2="690"/>
    <line class="separator" x1="390" y1="740"
          x2="580" y2="740"/>
    <text class="class-name" x="485" y="676">Menu</text>
    <text class="details" x="400" y="715">
        <tspan x="400">+ int menuId</tspan>
        <tspan x="400" dy="18">+ details: string</tspan>
    </text>
    <text class="details" x="400" y="765">
        <tspan x="400">+ add()</tspan>
        <tspan x="400" dy="18">+ update()</tspan>
    </text>


    <!-- CART CLASS -->
    <rect class="class-box" x="710" y="680"
          width="200" height="180"/>
    <line class="separator" x1="710" y1="720"
          x2="910" y2="720"/>
    <line class="separator" x1="710" y1="760"
          x2="910" y2="760"/>
    <text class="class-name" x="810" y="706">Cart</text>
    <text class="details" x="720" y="745">
        <tspan x="720">+ int cartId</tspan>
    </text>
    <text class="details" x="720" y="785">
        <tspan x="720">+ addItem()</tspan>
        <tspan x="720" dy="18">+ removeItem()</tspan>
        <tspan x="720" dy="18">+ calculateTotal()</tspan>
    </text>

</svg>

</body>
</html>
